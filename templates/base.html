<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block title %} Expense Tracker {% endblock %}</title>
</head>
<body>

    <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard' %}">Expense Tracker</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'transaction_add' %}">Add Transaction</a>
                    <a class="nav-link" href="{% url 'transaction_list' %}">Transactions</a>
                    <a class="nav-link" href="{% url 'goal_add' %}">Add Goals</a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline m-0">
                        {% csrf_token %}
                        <button type="submit" class="nav-link text-decoration-none">Log Out</button>
                    </form>
                {% else %}
                        <a class="nav-link" href="{% url 'register' %}">Register</a>
                        <a class="nav-link" href="{% url 'login' %}">Log In</a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% block content %}

    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
